name: ci

on:
  push:
    branches: [master]
  pull_request: {}
  workflow_call: {} # reused by release.yml before anything is published

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version # >=1.4.3; 1.3.x fails the fake-timer tests
      - run: bun install --frozen-lockfile
      - name: lint (biome, lint-only)
        run: bunx biome ci .
      - name: typecheck (src)
        run: bun run typecheck
      - name: typecheck (tests)
        run: bun run typecheck:tests
      - name: typecheck (console)
        run: bun run console:typecheck
      - name: console build is fresh (embedded assets match console/ source)
        run: |
          bun run console:build
          git diff --exit-code -- src/dashboard/assets.generated.ts || {
            echo "::error::src/dashboard/assets.generated.ts is stale: run 'bun run console:build' and commit it"
            exit 1
          }
      - name: unit + integration tests
        run: bun test --timeout 20000
      - name: e2e contract tests (real server + mock upstream + openai SDK)
        run: bun run test:e2e

  browser:
    # Playwright: the admin console in a real Chromium against the real server (tests/browser).
    # release.yml reuses this workflow, so a release also needs this job green.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: install Chromium (with system deps)
        run: bunx playwright install --with-deps chromium
      - name: browser e2e (bun run test:browser)
        run: bun run test:browser
      - name: upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: build image
        run: docker build -t aigw:ci .
      - name: smoke test (livez, readyz, non-root, auth, healthcheck, SIGTERM)
        run: ./scripts/docker-smoke.sh aigw:ci
