name: release

# Push a tag vX.Y.Z (equal to package.json "version") to publish:
#   - ghcr.io/<owner>/ai-gateway:X.Y.Z, :X.Y and :latest (multi-arch)
#   - standalone binaries (bun build --compile) + SHA256SUMS
#   - a GitHub Release with notes from CHANGELOG.md
# Nothing is published unless the full CI suite passes on the tagged commit.

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  meta:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - name: tag must equal package.json version
        id: v
        run: |
          tag="${GITHUB_REF_NAME}"
          pkg="$(jq -r .version package.json)"
          if [ "$tag" != "v$pkg" ]; then
            echo "::error::tag $tag does not match package.json version $pkg (expected v$pkg)"
            exit 1
          fi
          grep -q "VERSION = \"$pkg\"" src/version.ts || { echo "::error::src/version.ts is not $pkg"; exit 1; }
          echo "version=$pkg" >>"$GITHUB_OUTPUT"
          if [[ "$pkg" == *-* ]]; then echo "prerelease=true" >>"$GITHUB_OUTPUT"; else echo "prerelease=false" >>"$GITHUB_OUTPUT"; fi
      - name: CHANGELOG has a section for this version
        run: ./scripts/release-notes.sh "${{ steps.v.outputs.version }}" >/dev/null

  ci:
    needs: meta
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  binaries:
    needs: [meta, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: build + package (linux, darwin, windows)
        run: ./scripts/build-binaries.sh "${{ needs.meta.outputs.version }}"
      - name: verify SHA256SUMS
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: smoke test linux-x64 binary (from the packaged archive)
        run: |
          v="${{ needs.meta.outputs.version }}"
          mkdir -p /tmp/smoke && tar -C /tmp/smoke -xzf "dist/ai-gateway-$v-linux-x64.tar.gz"
          ls -la "/tmp/smoke/ai-gateway-$v-linux-x64"
          ./scripts/binary-smoke.sh "/tmp/smoke/ai-gateway-$v-linux-x64/ai-gateway"
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          if-no-files-found: error
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS

  docker:
    needs: [meta, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name (lowercase)
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >>"$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}
          # latest only for a non-prerelease semver tag; X.Y is skipped for prereleases.
          flavor: |
            latest=${{ needs.meta.outputs.prerelease == 'false' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=ai-gateway
            org.opencontainers.image.description=OpenAI-compatible AI gateway (TypeScript, Bun, Hono)
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          annotations: |
            org.opencontainers.image.description=OpenAI-compatible AI gateway (TypeScript, Bun, Hono)
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - name: build + push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke test the pushed image (amd64)
        run: |
          ref="${{ steps.img.outputs.name }}:${{ needs.meta.outputs.version }}"
          docker pull "$ref"
          docker image inspect -f '{{ index .Config.Labels "org.opencontainers.image.licenses" }}' "$ref" | grep -qx 'Apache-2.0'
          ./scripts/docker-smoke.sh "$ref"

  release:
    needs: [meta, binaries, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: binaries
          path: dist
      - name: release notes from CHANGELOG.md
        run: ./scripts/release-notes.sh "${{ needs.meta.outputs.version }}" >release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: v${{ needs.meta.outputs.version }}
          body_path: release-notes.md
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.meta.outputs.prerelease == 'false' }}
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
